# ============================================================
# Docker Compose para Apache Airflow — Pipeline GCP
# ============================================================
# Basado en la configuración oficial de Apache Airflow
# Documentación: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html
# ============================================================

x-airflow-common: &airflow-common
  build: . # Usa el Dockerfile personalizado del proyecto
  image: airflow-comprobantes:2.9.3
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # ── Credenciales GCP ────────────────────────────────────────────────
    # Las credenciales se montan desde el archivo local json_key.json
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/secrets/json_key.json
    # ── PYTHONPATH para importar módulos del proyecto ────────────────────
    PYTHONPATH: /opt/airflow/project
  volumes:
    - ./orquestador/dags:/opt/airflow/dags # DAGs del pipeline
    - ./orquestador/logs:/opt/airflow/logs # Logs de ejecución
    - ./orquestador/plugins:/opt/airflow/plugins # Plugins personalizados
    - .:/opt/airflow/project # Código del proyecto completo
    - ./json_key.json:/opt/airflow/secrets/json_key.json:ro # Credenciales GCP (solo lectura)
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:

  # ── Base de datos de Airflow ─────────────────────────────────────────
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ── Servidor Web (UI en localhost:8080) ──────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ── Scheduler (ejecuta los DAGs) ─────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8974/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ── Inicialización (se ejecuta una sola vez) ─────────────────────────
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname GCP \
          --role Admin \
          --email admin@comprobantes.com
        echo "Airflow inicializado correctamente."
    restart: on-failure
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'

volumes:
  postgres-db-volume:
